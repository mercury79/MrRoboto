; MrRoboto - firmware del cuerpo (el cuerpo es un periférico).
; Placa: HiLetgo ESP32 DevKitC-32 / NodeMCU-32S (WROOM-32, USB CP2102).
;
; Dos entornos que comparten [env]:
;   esp32dev  -> flasheo por USB (cable). Necesario la PRIMERA vez.
;   esp32ota  -> flasheo por WiFi (OTA). Comodo, sin botones, una vez que
;                la placa ya corre un firmware con WiFi.

[env]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200

; -------- USB (cable) --------
[env:esp32dev]
upload_port  = COM4
monitor_port = COM4

; -------- OTA (WiFi) --------
; upload_port es la IP que el ESP32 imprime en el monitor al conectar.
; Cambiala aqui cuando la sepas. El password OTA debe coincidir con el
; OTA_PASSWORD de secrets.h.
[env:esp32ota]
upload_protocol = espota
upload_port     = mrroboto.local
monitor_port    = COM4
upload_flags =
    --auth=mrroboto
